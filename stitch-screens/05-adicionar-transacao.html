<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for better mobile feel if needed */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen pb-safe antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-background dark:bg-on-background flex justify-between items-center h-16 px-margin-mobile z-50 transition-opacity duration-200">
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Adicionar Transação</h1>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-[88px] px-margin-mobile max-w-[390px] mx-auto pb-32">
<!-- Transaction Form -->
<form class="flex flex-col gap-stack-lg">
<!-- Amount Input (Bento Style Hero) -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(13,77,77,0.05)] p-stack-md flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/20 to-transparent pointer-events-none"></div>
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm relative z-10" for="amount">Valor</label>
<div class="flex items-center gap-2 relative z-10">
<span class="font-numeric-lg text-numeric-lg text-primary">R$</span>
<input class="w-full max-w-[200px] bg-transparent border-none text-center font-display text-display text-primary placeholder-primary/40 focus:ring-0 p-0 m-0" id="amount" placeholder="0,00" step="0.01" type="number"/>
</div>
</div>
<!-- Type Selector (Segmented Control) -->
<div class="bg-surface-container p-1 rounded-lg flex gap-1">
<label class="flex-1 text-center">
<input checked="" class="peer sr-only" name="type" type="radio" value="expense"/>
<div class="py-2 px-3 rounded-md font-label-md text-label-md text-on-surface-variant cursor-pointer transition-colors peer-checked:bg-surface-container-lowest peer-checked:text-error peer-checked:shadow-sm">
                        Despesa
                    </div>
</label>
<label class="flex-1 text-center">
<input class="peer sr-only" name="type" type="radio" value="income"/>
<div class="py-2 px-3 rounded-md font-label-md text-label-md text-on-surface-variant cursor-pointer transition-colors peer-checked:bg-surface-container-lowest peer-checked:text-secondary peer-checked:shadow-sm">
                        Receita
                    </div>
</label>
<label class="flex-1 text-center">
<input class="peer sr-only" name="type" type="radio" value="transfer"/>
<div class="py-2 px-3 rounded-md font-label-md text-label-md text-on-surface-variant cursor-pointer transition-colors peer-checked:bg-surface-container-lowest peer-checked:text-primary peer-checked:shadow-sm">
                        Transferência
                    </div>
</label>
</div>
<!-- Details Section (Glassmorphism inspired card) -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(13,77,77,0.05)] p-stack-md flex flex-col gap-stack-md">
<!-- Category Dropdown -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="category">Categoria</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">category</span>
<select class="w-full h-12 bg-surface-container-low border-none rounded-lg pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary appearance-none" id="category">
<option disabled="" selected="" value="">Selecione uma categoria</option>
<option value="food">Alimentação</option>
<option value="transport">Transporte</option>
<option value="housing">Moradia</option>
<option value="entertainment">Lazer</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Description Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="description">Descrição</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">description</span>
<input class="w-full h-12 bg-surface-container-low border-none rounded-lg pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary placeholder-outline-variant" id="description" placeholder="Ex: Mercado, Uber, etc." type="text"/>
</div>
</div>
<!-- Date Picker -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="date">Data</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full h-12 bg-surface-container-low border-none rounded-lg pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary" id="date" type="date"/>
</div>
</div>
</div>
<!-- Save Button Area (Fixed at bottom just above nav if present, but for now inline as requested) -->
<div class="mt-stack-lg">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-headline-md text-headline-md shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">check_circle</span>
                    Salvar Transação
                </button>
</div>
</form>
</main>
<!-- Navigation omitted as per task-focused logic (Add Transaction is a transactional/focused screen with a back button) -->
<script>
        // Simple micro-interaction for the amount input
        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('focus', () => {
            amountInput.parentElement.parentElement.classList.add('scale-[1.02]', 'shadow-md');
            amountInput.parentElement.parentElement.style.transition = 'all 0.3s ease';
        });
        amountInput.addEventListener('blur', () => {
            amountInput.parentElement.parentElement.classList.remove('scale-[1.02]', 'shadow-md');
        });
        
        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body></html>
