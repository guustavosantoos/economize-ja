<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center px-margin-mobile py-stack-lg">
<!-- Top Navigation for Transactional Screen (Back Button only) -->
<header class="fixed top-0 w-full bg-background flex justify-between items-center h-16 px-margin-mobile z-50">
<button aria-label="Voltar" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-display text-headline-md font-headline-md text-primary mr-auto ml-2">Economize Já</div>
</header>
<main class="w-full max-w-md mt-16 pb-24">
<div class="mb-stack-lg text-center">
<h1 class="font-display text-display text-primary mb-stack-sm">Criar Conta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Junte-se a nós e comece a controlar suas finanças de forma simples e segura.</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-stack-lg border border-surface-variant">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Name Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="name">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-transparent rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant" id="name" name="name" placeholder="João da Silva" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-transparent rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="joao@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field (Error State) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-error">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-error-container border border-error rounded-lg font-body-md text-body-md text-on-error-container focus:outline-none focus:ring-2 focus:ring-error focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password" value="senha123"/>
<button aria-label="Mostrar senha" class="absolute right-3 top-1/2 -translate-y-1/2 text-error hover:text-on-error-container" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-label-md text-label-md text-error mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">error</span>
                        A senha deve ter no mínimo 8 caracteres, incluindo números e símbolos.
                    </p>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirmar Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-low border border-transparent rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full py-3 bg-primary text-on-primary rounded-full font-label-md text-label-md font-bold shadow-md hover:shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Criar Conta
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant">
                Já possui uma conta? 
                <a class="text-primary font-semibold hover:underline decoration-primary/50 underline-offset-4" href="#">Faça login</a>
</div>
</div>
</main>
