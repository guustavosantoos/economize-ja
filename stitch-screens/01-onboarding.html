<script>
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = document.getElementById('carousel');
            const indicators = document.querySelectorAll('.carousel-indicator');
            const nextBtn = document.getElementById('nextBtn');
            const skipBtn = document.getElementById('skipBtn');
            const totalSlides = 3;
            let currentSlide = 0;

            // Update indicators based on scroll position
            carousel.addEventListener('scroll', () => {
                const scrollLeft = carousel.scrollLeft;
                const slideWidth = carousel.clientWidth;
                currentSlide = Math.round(scrollLeft / slideWidth);
                updateUI();
            });

            function updateUI() {
                // Update indicators
                indicators.forEach((indicator, index) => {
                    if (index === currentSlide) {
                        indicator.classList.add('active');
                        indicator.classList.remove('bg-outline-variant');
                    } else {
                        indicator.classList.remove('active');
                        indicator.classList.add('bg-outline-variant');
                    }
                });

                // Update button text on last slide
                if (currentSlide === totalSlides - 1) {
                    nextBtn.innerHTML = `Get Started <span class="material-symbols-outlined text-[18px]">check</span>`;
                    skipBtn.style.opacity = '0';
                    skipBtn.style.pointerEvents = 'none';
                } else {
                    nextBtn.innerHTML = `Next <span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
                    skipBtn.style.opacity = '1';
                    skipBtn.style.pointerEvents = 'auto';
                }
            }

            // Next button click handler
            nextBtn.addEventListener('click', () => {
                if (currentSlide < totalSlides - 1) {
                    scrollToSlide(currentSlide + 1);
                } else {
                    // Navigate to next screen (Dashboard)
                    console.log('Navigate to Dashboard');
                    // window.location.href = '/dashboard'; 
                }
            });

            // Skip button click handler
            skipBtn.addEventListener('click', () => {
                scrollToSlide(totalSlides - 1);
            });

            // Make scrollToSlide globally available for indicator clicks
            window.scrollToSlide = (index) => {
                const slideWidth = carousel.clientWidth;
                carousel.scrollTo({
                    left: index * slideWidth,
                    behavior: 'smooth'
                });
            };
        });
    </script>
