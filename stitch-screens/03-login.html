    background-color: #F9FAFB;
  }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased relative">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-8 relative z-10">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-surface-container-low to-transparent opacity-50 -z-10 pointer-events-none"></div>
<!-- Login Container -->
<div class="w-full max-w-[390px] mx-auto bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(13,77,77,0.05)] overflow-hidden">
<!-- Header Area -->
<div class="pt-8 pb-6 px-gutter text-center">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-[32px]">account_balance_wallet</span>
</div>
<h1 class="font-display text-display text-primary mb-2">Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back to Economize Já</p>
</div>
<!-- Form Area -->
<div class="px-gutter pb-8">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-none bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors font-body-md text-body-md text-on-surface placeholder-outline-variant min-h-[48px]" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-stack-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-none bg-surface-container-low rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors font-body-md text-body-md text-on-surface placeholder-outline-variant min-h-[48px]" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-outline">visibility_off</span>
</div>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-[0_4px_12px_rgba(13,77,77,0.15)] font-label-md text-label-md text-on-primary bg-primary hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary min-h-[48px] items-center transition-all active:scale-[0.98] active:shadow-sm" type="submit">
              Sign In
            </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
              Or continue with
            </span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-gutter">
<button class="flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px] active:scale-[0.98]" type="button">
<svg class="w-5 h-5 mr-2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
            Google
          </button>
<button class="flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px] active:scale-[0.98]" type="button">
<svg class="w-5 h-5 mr-2" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-.8 1.56.05 2.89.62 3.84 1.76-3.27 1.83-2.69 6.2 0 7.37-.8 1.96-1.74 3.5-2.42 3.84zm-3.7-14.73c.69-1.07 1.11-2.47.88-3.8-1.28.16-2.73.96-3.53 1.94-.65.78-1.16 2.13-.96 3.44 1.39.19 2.81-.6 3.61-1.58z"></path></svg>
            Apple
          </button>
</div>
</div>
<!-- Footer Link -->
<div class="px-gutter py-6 bg-surface-container-low text-center rounded-b-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
          Don't have an account? <a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Note: TopAppBar and BottomNavBar are suppressed here as this is a transactional Login screen -->
</body></html>
